<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>הבוט הקולי - מענק עבודה</title>

  <!-- Dialogflow Messenger widget -->
  <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">
  <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>

  <style>
    body{font-family:system-ui,"Segoe UI",Arial,sans-serif;margin:0}
    .wrap{max-width:800px;margin:0 auto;padding:24px}
    df-messenger{position:fixed;bottom:16px;right:16px;z-index:999;direction:rtl}
  </style>
  <style>
  body{
    margin:0;
    font-family:system-ui,"Segoe UI",Arial,sans-serif;
    /* רקע עם שכבת בהירות קלה */
    background:
      linear-gradient(rgba(255,255,255,.75), rgba(255,255,255,.75)),
      url('gem.png') center / cover fixed no-repeat;
  }
  /* השאר ה-CSS הקיים (wrap, df-messenger וכו') כמו שהוא */
</style>

</head>
  <button id="micBtn" style="position:fixed;bottom:90px;right:16px;z-index:1000;padding:10px 14px;border:0;border-radius:999px;background:#0b57d0;color:#fff;cursor:pointer">🎤 דבר/י</button>
<script>
(function(){
  const df = document.querySelector('df-messenger');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = document.getElementById('micBtn');

  async function sendToMessenger(text){
    const chat = df.shadowRoot.querySelector('df-messenger-chat').shadowRoot;
    const input = chat.querySelector('textarea');
    const send  = chat.querySelector('button[aria-label="Send message"],button[aria-label="שלח הודעה"]');
    input.value = text; input.dispatchEvent(new Event('input',{bubbles:true}));
    send ? send.click() : input.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',code:'Enter',bubbles:true}));
  }
  function startMic(){
    if(!SR){ alert('הדפדפן לא תומך בזיהוי קולי. נסו Chrome/Edge.'); return; }
    const r = new SR(); r.lang='he-IL'; r.interimResults=false; r.maxAlternatives=1;
    r.onresult = e => sendToMessenger(e.results[0][0].transcript);
    r.start();
  }
  mic.addEventListener('click', startMic);

  // הקראת תשובות
  df.addEventListener('df-response-received', e=>{
    const msgs = e.detail?.response?.queryResult?.responseMessages || [];
    const txt = msgs.flatMap(m=>m.text?.text||[]).join(' ').trim();
    if(!txt || !('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(txt);
    const pick=()=>{ const v=speechSynthesis.getVoices().find(x=>(x.lang||'').toLowerCase().startsWith('he')); if(v) u.voice=v; speechSynthesis.speak(u); };
    speechSynthesis.getVoices().length?pick():speechSynthesis.onvoiceschanged=pick;
  });
})();
</script>

<body>
  <div class="wrap">
    <h1>הבוט הקולי - מענק עבודה</h1>
    <p>דוגמאות: “מה זמן הטיפול למענק?”, “מי זכאי למענק?”, “איך מגישים בקשה?”.</p>
  </div>

  <df-messenger
    project-id="sandbox-kosta-test"
    agent-id="bc0af719-bdac-48d8-ba78-3befdd3c5a00"
    location="europe-west1"
    language-code="he-il"
    max-query-length="-1">
    <df-messenger-chat-bubble chat-title="בוט מענק עבודה"></df-messenger-chat-bubble>
  </df-messenger>
</body>
</html>
