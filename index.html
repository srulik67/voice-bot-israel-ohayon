<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>הבוט הקולי - מענק עבודה</title>

  <!-- favicon כדי למנוע 404 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎤%3C/text%3E%3C/svg%3E">

  <!-- Dialogflow Messenger -->
  <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">
  <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>

  <style>
    body{
      margin:0;
      font-family:system-ui,"Segoe UI",Arial,sans-serif;
      background:
        linear-gradient(rgba(255,255,255,.75), rgba(255,255,255,.75)),
        url('gem.png') center / cover fixed no-repeat;
    }
    .wrap{max-width:800px;margin:0 auto;padding:24px}
    h1{margin:0 0 8px}
    p{margin:0 0 12px;color:#444}

    df-messenger{
      position:fixed; bottom:16px; right:16px; z-index:999; direction:rtl;
      --df-messenger-font-family:system-ui,"Segoe UI",Arial,sans-serif;
    }
    #micBtn{
      position:fixed; bottom:90px; right:16px; z-index:1000;
      padding:10px 14px; border:0; border-radius:999px;
      background:#0b57d0; color:#fff; cursor:pointer; font-size:16px;
      box-shadow:0 6px 18px rgba(0,0,0,.18);
      min-width: 160px;
    }
    #micBtn[aria-busy="true"]{ background:#d00 }
    #debug{position:fixed;left:12px;bottom:12px;background:rgba(0,0,0,.6);color:#fff;
           padding:8px 10px;border-radius:8px;font:12px/1.4 monospace;max-width:42vw;
           max-height:42vh;overflow:auto;direction:ltr;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>הבוט הקולי - מענק עבודה</h1>
    <p>דוגמאות: “מה זמן הטיפול למענק?”, “מי זכאי למענק?”, “איך מגישים בקשה?”.</p>
  </div>

  <button id="micBtn" type="button" title="דבר/י">🎤 דבר/י</button>
  <div id="debug" hidden></div>

  <df-messenger
    project-id="sandbox-kosta-test"
    agent-id="bc0af719-bdac-48d8-ba78-3befdd3c5a00"
    location="europe-west1"
    language-code="he-il"
    max-query-length="-1">
    <df-messenger-chat-bubble chat-title="בוט מענק עבודה"></df-messenger-chat-bubble>
  </df-messenger>

<script>
(() => {
  const df  = document.querySelector('df-messenger');
  const mic = document.getElementById('micBtn');
  const dbg = document.getElementById('debug');
  const SR  = window.SpeechRecognition || window.webkitSpeechRecognition;

  // עוזר לוג קטן
  const log = (...a)=>{ dbg.hidden=false; dbg.textContent += a.join(' ')+'\n'; console.log(...a); };

  // סשן חדש בכל טעינה – מונע הקשר ישן
  df.setAttribute('session-id', 'web-' + Date.now());

  // ===== עזרי DOM עמוקים (Shadow DOM recursion) =====
  const sleep = (ms)=>new Promise(r=>setTimeout(r,ms));

  function queryDeepAll(root, selector){
    const out = [];
    function walk(node){
      if (!node) return;
      const scope = node.shadowRoot || node;
      try { scope.querySelectorAll?.(selector)?.forEach(el => out.push(el)); } catch(_) {}
      const kids = scope.children || [];
      for (const child of kids) { if (child.shadowRoot) walk(child.shadowRoot); walk(child); }
    }
    walk(root);
    return out;
  }
  const queryDeep = (root, sel)=> (queryDeepAll(root, sel)[0] || null);

  function openBubble(root){
    const btn1 = queryDeep(root, 'df-messenger-chat-bubble button, df-messenger-chat-bubble [role="button"]');
    if (btn1) { btn1.click(); return true; }
    const btn2 = queryDeep(root, 'button[aria-label*="Open"], button[aria-label*="פתח"], button[aria-label*="open"], button[aria-label*="chat"]');
    if (btn2) { btn2.click(); return true; }
    return false;
  }
  function findAnyInput(root){
    return (
      queryDeep(root, 'textarea') ||
      queryDeep(root, 'div[contenteditable="true"]') ||
      queryDeep(root, '[role="textbox"]') ||
      queryDeep(root, 'input[type="text"]') ||
      queryDeep(root, 'input:not([type])')
    );
  }
  function findSendButton(root){
    return queryDeep(root, 'button[aria-label*="Send"], button[aria-label*="שלח"], button[type="submit"]') || null;
  }

  async function ensureDfDefined(){
    if (customElements.get('df-messenger')) return true;
    let ok=false; await Promise.race([ customElements.whenDefined('df-messenger').then(()=>ok=true), sleep(8000) ]);
    return ok;
  }

  async function waitForMessengerReady(timeoutMs=30000){
    if (!await ensureDfDefined()) throw new Error('df-messenger script did not load');
    const deadline = Date.now() + timeoutMs;
    while (Date.now() < deadline) {
      const root = df.shadowRoot;
      if (!root){ await sleep(120); continue; }
      if (!queryDeep(root, 'df-messenger-chat')) openBubble(root);
      const input = findAnyInput(root);
      if (input) return { root, input };
      await sleep(150);
    }
    throw new Error('Messenger not ready (timeout)');
  }

  async function sendToMessenger(text){
    const { root, input } = await waitForMessengerReady();
    if (!queryDeep(root, 'df-messenger-chat')) openBubble(root);

    if (input.tagName === 'TEXTAREA') {
      input.value = text; input.dispatchEvent(new Event('input', { bubbles:true }));
    } else if (input.isContentEditable || input.getAttribute?.('contenteditable') === 'true' || input.getAttribute?.('role') === 'textbox') {
      input.focus(); input.textContent=''; const range=document.createRange(); range.selectNodeContents(input);
      const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      document.execCommand('insertText', false, text);
      input.dispatchEvent(new InputEvent('input', { bubbles:true, data:text, inputType:'insertText' }));
    } else {
      input.value = text; input.dispatchEvent(new Event('input', { bubbles:true }));
    }
    const sendBtn = findSendButton(root);
    if (sendBtn) sendBtn.click();
    else {
      input.dispatchEvent(new KeyboardEvent('keydown', { key:'Enter', code:'Enter', bubbles:true }));
      input.dispatchEvent(new KeyboardEvent('keyup',   { key:'Enter', code:'Enter', bubbles:true }));
    }
  }

  // הקראת תשובות
  df.addEventListener('df-response-received', (e)=>{
    try{
      const msgs = e.detail?.response?.queryResult?.responseMessages || [];
      const txt  = msgs.flatMap(m=>m.text?.text||[]).join(' ').trim();
      if (!txt || !('speechSynthesis' in window)) return;
      const u = new SpeechSynthesisUtterance(txt); u.lang='he-IL';
      const v = speechSynthesis.getVoices().find(x => (x.lang||'').toLowerCase().startsWith('he'));
      if (v) u.voice = v; speechSynthesis.speak(u);
    }catch(_){}
  });

  // ===== Web Speech: טיפול ב-no-speech + דיבאג =====
  if (!SR) {
    mic.disabled = true;
    mic.textContent = '🎤 לא נתמך בדפדפן זה';
    mic.title = 'Web Speech API לא זמין. מומלץ Chrome/Edge.';
    return;
  }

  let busy = false;

  mic.addEventListener('click', async ()=>{
    if (busy) return;
    busy = true;
    const label = mic.textContent;
    mic.setAttribute('aria-busy','true');
    mic.textContent = '⏳ מכין צ׳אט...';
    try { await waitForMessengerReady(); } catch(e){ log(e.message); mic.textContent='❌ הווידג׳ט לא נטען'; mic.removeAttribute('aria-busy'); busy=false; return; }

    // “חימום” מיקרופון – עם מנגנוני שיפור קול
    try {
      await navigator.mediaDevices.getUserMedia({ audio: { noiseSuppression:true, echoCancellation:true, autoGainControl:true } });
    } catch (e) {
      log('mic permission', e.name||e); mic.textContent='❌ אין הרשאת מיקרופון'; mic.removeAttribute('aria-busy'); busy=false; return;
    }

    async function attempt(retry=false){
      return new Promise(resolve=>{
        const r = new SR();
        r.lang = 'he-IL';
        r.interimResults = true;
        r.continuous = false;

        let finalText = '';
        let sawAudio=false, sawSpeech=false;

        r.onaudiostart = ()=>{ log('onaudiostart'); };
        r.onaudioend   = ()=>{ log('onaudioend'); };
        r.onsoundstart = ()=>{ log('onsoundstart'); sawAudio=true; };
        r.onsoundend   = ()=>{ log('onsoundend'); };
        r.onspeechstart= ()=>{ log('onspeechstart'); sawSpeech=true; };
        r.onspeechend  = ()=>{ log('onspeechend'); };

        r.onresult = (ev)=>{
          let interim='';
          for (let i=ev.resultIndex;i<ev.results.length;i++){
            const t = ev.results[i][0].transcript || '';
            if (ev.results[i].isFinal) finalText += t;
            else interim += t;
          }
          if (interim) mic.textContent = '🎙️ ' + interim;
        };

        r.onerror = async (ev)=>{
          log('speech error', ev.error||ev);
          // no-speech → אם לא זוהה sound/speech ובפעם ראשונה – ננסה שוב
          if (ev.error === 'no-speech' && !retry) {
            try { r.abort(); } catch(_){}
            resolve({retry:true});
          } else {
            resolve({finalText:''});
          }
        };

        r.onend = ()=>{
          log('onend finalText=', JSON.stringify(finalText));
          resolve({finalText});
        };

        try { r.start(); mic.textContent='🎙️ מקשיב...'; }
        catch(e){ log('start err', e); resolve({finalText:''}); }
      });
    }

    let res = await attempt(false);
    if (res.retry) {
      mic.textContent = '🗣️ נסו לדבר שוב...';
      await sleep(250);
      res = await attempt(true);
    }

    const text = (res.finalText||'').trim();
    mic.removeAttribute('aria-busy'); mic.textContent = label; busy=false;

    if (!text){ mic.title='לא זוהה דיבור (no-speech). ודא/י שהמיקרופון הנכון נבחר ונסו לדבר מיד אחרי הלחיצה.'; return; }
    try { mic.textContent='📤 שולח...'; await sendToMessenger(text); }
    finally { mic.textContent = label; }
  });
})();
</script>
</body>
</html>
