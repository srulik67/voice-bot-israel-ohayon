<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>הבוט הקולי - מענק עבודה</title>

  <!-- favicon כדי לא לקבל 404 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎤%3C/text%3E%3C/svg%3E">

  <!-- Dialogflow Messenger widget -->
  <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">
  <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>

  <style>
    body{
      margin:0;
      font-family:system-ui,"Segoe UI",Arial,sans-serif;
      /* רקע עם שכבת בהירות קלה */
      background:
        linear-gradient(rgba(255,255,255,.75), rgba(255,255,255,.75)),
        url('gem.png') center / cover fixed no-repeat;
    }
    .wrap{max-width:800px;margin:0 auto;padding:24px}
    df-messenger{
      position:fixed; bottom:16px; right:16px; z-index:999; direction:rtl;
      --df-messenger-font-family:system-ui,"Segoe UI",Arial,sans-serif;
    }
    #micBtn{
      position:fixed; bottom:90px; right:16px; z-index:1000;
      padding:10px 14px; border:0; border-radius:999px;
      background:#0b57d0; color:#fff; cursor:pointer; font-size:16px;
      box-shadow:0 6px 18px rgba(0,0,0,.18);
    }
    #micBtn[aria-busy="true"]{ background:#d00 }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>הבוט הקולי - מענק עבודה</h1>
    <p>דוגמאות: “מה זמן הטיפול למענק?”, “מי זכאי למענק?”, “איך מגישים בקשה?”.</p>
  </div>

  <!-- כפתור מיקרופון -->
  <button id="micBtn" type="button" title="דבר/י">🎤 דבר/י</button>

  <!-- הווידג׳ט -->
  <df-messenger
    project-id="sandbox-kosta-test"
    agent-id="bc0af719-bdac-48d8-ba78-3befdd3c5a00"
    location="europe-west1"
    language-code="he-il"
    max-query-length="-1">
    <df-messenger-chat-bubble chat-title="בוט מענק עבודה"></df-messenger-chat-bubble>
  </df-messenger>

 <script>
(function () {
  function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

  async function waitForMessengerReady(df, timeoutMs = 60000) {
    await customElements.whenDefined('df-messenger');
    const deadline = Date.now() + timeoutMs;

    while (Date.now() < deadline) {
      const root = df.shadowRoot;
      if (!root) { await sleep(120); continue; }

      // פתח בועה אם סגור
      const bubble = root.querySelector('df-messenger-chat-bubble');
      const bubbleBtn = bubble?.shadowRoot?.querySelector('button');
      const chatEl = root.querySelector('df-messenger-chat');
      if (bubbleBtn && !chatEl) bubbleBtn.click();

      // בדוק שוב לאחר פתיחה
      const chat = root.querySelector('df-messenger-chat');
      const chatRoot = chat?.shadowRoot;
      const input = chatRoot?.querySelector('textarea');

      if (input) return { root, chatRoot, input };

      await sleep(150);
    }
    throw new Error('Messenger not ready');
  }

  // בחירת קול TTS עברי כשהקולות נטענים
  function chooseHebrewVoice() {
    const voices = speechSynthesis.getVoices();
    return voices.find(v => (v.lang || '').toLowerCase().startsWith('he')) || null;
  }

  function attachTTS(df){
    let hebVoice = null;
    if ('speechSynthesis' in window) {
      hebVoice = chooseHebrewVoice();
      window.speechSynthesis.onvoiceschanged = () => { hebVoice = chooseHebrewVoice(); };
    }

    df.addEventListener('df-response-received', (e) => {
      try {
        const msgs = e.detail?.response?.queryResult?.responseMessages || [];
        const text = msgs.flatMap(m => m.text?.text || []).join(' ').trim();
        if (!text || !('speechSynthesis' in window)) return;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'he-IL';
        if (hebVoice) u.voice = hebVoice;
        window.speechSynthesis.speak(u);
      } catch {}
    });
  }

  // שליחה אמינה: הקלדה + אירוע input + שליחת Enter
  function sendToMessenger(df, ctx, text){
    const { chatRoot, input } = ctx;

    // ודא פתוח
    const bubbleBtn = df.shadowRoot?.querySelector('df-messenger-chat-bubble')?.shadowRoot?.querySelector('button');
    const chat = df.shadowRoot?.querySelector('df-messenger-chat');
    if (bubbleBtn && !chat) bubbleBtn.click();

    input.value = text;
    input.dispatchEvent(new Event('input', { bubbles: true }));
    // עדיף Enter – עובד גם אם אין aria-label קבוע ל- Send
    input.dispatchEvent(new KeyboardEvent('keydown', { key:'Enter', code:'Enter', bubbles:true }));
  }

  function boot(){
    const df = document.querySelector('df-messenger');
    const micBtn = document.getElementById('micBtn');
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!micBtn) return;

    (async () => {
      let ctx;
      try {
        ctx = await waitForMessengerReady(df);
      } catch (e) {
        console.error(e);
        micBtn.disabled = true;
        micBtn.textContent = '🎤 שגיאה בטעינת הווידג׳ט';
        return;
      }

      attachTTS(df);

      if (!SR) {
        micBtn.disabled = true;
        micBtn.textContent = '🎤 לא נתמך בדפדפן זה';
        micBtn.title = 'Web Speech API לא זמין. מומלץ Chrome/Edge בדסקטופ.';
        return;
      }

      micBtn.addEventListener('click', () => {
        const r = new SR();
        r.lang = 'he-IL';
        r.interimResults = false;
        r.maxAlternatives = 1;

        r.onstart = () => micBtn.setAttribute('aria-busy','true');
        r.onend   = () => micBtn.removeAttribute('aria-busy');
        r.onerror = () => micBtn.removeAttribute('aria-busy');
        r.onresult = (ev) => {
          const text = ev.results?.[0]?.[0]?.transcript || '';
          if (text.trim()) sendToMessenger(df, ctx, text.trim());
        };

        try { r.start(); } catch {}
      });
    })();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>

</body>
</html>
