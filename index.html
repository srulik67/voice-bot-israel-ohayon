<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>הבוט הקולי - מענק עבודה</title>

  <!-- favicon כדי למנוע 404 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎤%3C/text%3E%3C/svg%3E">

  <!-- Dialogflow Messenger -->
  <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">
  <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>

  <style>
    body{
      margin:0;
      font-family:system-ui,"Segoe UI",Arial,sans-serif;
      background:
        linear-gradient(rgba(255,255,255,.75), rgba(255,255,255,.75)),
        url('gem.png') center / cover fixed no-repeat;
    }
    .wrap{max-width:800px;margin:0 auto;padding:24px}
    df-messenger{
      position:fixed; bottom:16px; right:16px; z-index:999; direction:rtl;
      --df-messenger-font-family:system-ui,"Segoe UI",Arial,sans-serif;
    }
    #micBtn{
      position:fixed; bottom:90px; right:16px; z-index:1000;
      padding:10px 14px; border:0; border-radius:999px;
      background:#0b57d0; color:#fff; cursor:pointer; font-size:16px;
      box-shadow:0 6px 18px rgba(0,0,0,.18);
    }
    #micBtn[aria-busy="true"]{ background:#d00 }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>הבוט הקולי - מענק עבודה</h1>
    <p>דוגמאות: “מה זמן הטיפול למענק?”, “מי זכאי למענק?”, “איך מגישים בקשה?”.</p>
  </div>

  <button id="micBtn" type="button" title="דבר/י">🎤 דבר/י</button>

  <df-messenger
    project-id="sandbox-kosta-test"
    agent-id="bc0af719-bdac-48d8-ba78-3befdd3c5a00"
    location="europe-west1"
    language-code="he-il"
    max-query-length="-1"
    session-id="web-{{RANDOM}}">
    <df-messenger-chat-bubble chat-title="בוט מענק עבודה"></df-messenger-chat-bubble>
  </df-messenger>

<script>
(function () {
  function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

  async function waitForMessengerReady(df, timeoutMs = 60000) {
    await customElements.whenDefined('df-messenger');
    const deadline = Date.now() + timeoutMs;

    while (Date.now() < deadline) {
      const root = df.shadowRoot;
      if (!root) { await sleep(120); continue; }

      // פתח את הבועה אם הצ'אט סגור
      const bubble = root.querySelector('df-messenger-chat-bubble');
      const bubbleBtn = bubble?.shadowRoot?.querySelector('button');
      const chatEl0 = root.querySelector('df-messenger-chat');
      if (bubbleBtn && !chatEl0) bubbleBtn.click();

      const chatEl = root.querySelector('df-messenger-chat');
      const chatRoot = chatEl?.shadowRoot;
      const input = chatRoot?.querySelector('textarea');
      const form  = chatRoot?.querySelector('form');

      if (input && form) return { root, chatRoot, input, form };
      await sleep(150);
    }
    throw new Error('Messenger not ready');
  }

  function sendText(ctx, text){
    const { chatRoot, input } = ctx;
    input.value = text;
    input.dispatchEvent(new Event('input', { bubbles: true }));
    // שליחה באנטר – אמין גם אם aria-label של Send משתנה
    input.dispatchEvent(new KeyboardEvent('keydown', { key:'Enter', code:'Enter', bubbles:true }));
  }

  function mountMicInsideMessenger(df, ctx){
    const { form } = ctx;
    // הימנע מהוספה כפולה
    if (form.querySelector('#dfx-mic')) return;

    // צור כפתור
    const btn = document.createElement('button');
    btn.id = 'dfx-mic';
    btn.type = 'button';
    btn.title = 'דבר/י';
    btn.textContent = '🎤';
    btn.setAttribute('aria-label','הקלט דיבור');
    // עיצוב מינימלי שמתמזג עם הפוטר של הווידג׳ט
    Object.assign(btn.style, {
      display:'inline-flex', alignItems:'center', justifyContent:'center',
      width:'36px', height:'36px', marginInlineStart:'8px',
      border:'none', borderRadius:'999px', cursor:'pointer',
      fontSize:'18px', lineHeight:'1',
      background:'var(--df-messenger-button-color,#0b57d0)', color:'#fff',
      boxShadow:'0 2px 6px rgba(0,0,0,.2)', flex:'0 0 auto'
    });

    // החדרה לשורת הפורם – ליד כפתור השליחה
    // ברוב הגרסאות הפורם מסודר ב-flex row, אז הוספה בסוף מציבה ליד Send.
    form.appendChild(btn);

    // STT
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      btn.disabled = true;
      btn.title = 'זיהוי דיבור לא נתמך בדפדפן זה (מומלץ Chrome/Edge)';
      return;
    }

    let busy = false;
    btn.addEventListener('click', () => {
      if (busy) return;
      const r = new SR();
      r.lang = 'he-IL';
      r.interimResults = false;
      r.maxAlternatives = 1;

      const setBusy = (v)=>{ busy=v; btn.style.opacity = v?'.7':'1'; btn.style.filter = v?'grayscale(0.2)':'none'; };

      r.onstart = () => setBusy(true);
      r.onend   = () => setBusy(false);
      r.onerror = () => setBusy(false);
      r.onresult = (ev) => {
        const text = ev.results?.[0]?.[0]?.transcript || '';
        if (text.trim()) sendText(ctx, text.trim());
      };
      try { r.start(); } catch {}
    });
  }

  // אופציונלי: קריאה טקסט-לדיבור על תשובת הבוט
  function attachTTS(df){
    if (!('speechSynthesis' in window)) return;
    let heVoice = null;
    const pick = ()=> speechSynthesis.getVoices().find(v => (v.lang||'').toLowerCase().startsWith('he')) || null;
    heVoice = pick();
    speechSynthesis.onvoiceschanged = () => { heVoice = pick(); };

    df.addEventListener('df-response-received', (e) => {
      try {
        const msgs = e.detail?.response?.queryResult?.responseMessages || [];
        const text = msgs.flatMap(m => m.text?.text || []).join(' ').trim();
        if (!text) return;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'he-IL';
        if (heVoice) u.voice = heVoice;
        speechSynthesis.speak(u);
      } catch {}
    });
  }

  async function boot(){
    const df = document.querySelector('df-messenger');
    if (!df) return;

    let ctx;
    try { ctx = await waitForMessengerReady(df); }
    catch (e){ console.error(e); return; }

    attachTTS(df);
    mountMicInsideMessenger(df, ctx);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>

</body>
</html>
