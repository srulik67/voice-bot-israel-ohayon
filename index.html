<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>הבוט הקולי - מענק עבודה</title>

  <!-- favicon קטן כדי למנוע 404 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎤%3C/text%3E%3C/svg%3E">

  <!-- Dialogflow Messenger -->
  <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">
  <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>

  <style>
    body{
      margin:0;
      font-family:system-ui,"Segoe UI",Arial,sans-serif;
      /* תמונת רקע gem.png עם שכבת בהירות */
      background:
        linear-gradient(rgba(255,255,255,.75), rgba(255,255,255,.75)),
        url('gem.png') center / cover fixed no-repeat;
    }
    .wrap{max-width:800px;margin:0 auto;padding:24px}
    h1{margin:0 0 8px} p{margin:0 0 12px;color:#444}

    df-messenger{
      position:fixed; bottom:16px; right:16px; z-index:999; direction:rtl;
      --df-messenger-font-family:system-ui,"Segoe UI",Arial,sans-serif;
    }
    #micBtn{
      position:fixed; bottom:90px; right:16px; z-index:1000;
      padding:10px 14px; border:0; border-radius:999px;
      background:#0b57d0; color:#fff; cursor:pointer; font-size:16px;
      box-shadow:0 6px 18px rgba(0,0,0,.18);
      min-width:160px;
    }
    #micBtn[aria-busy="true"]{ background:#d00 }
    #debug{position:fixed;left:12px;bottom:12px;background:rgba(0,0,0,.6);color:#fff;
           padding:8px 10px;border-radius:8px;font:12px/1.4 monospace;max-width:44vw;
           max-height:42vh;overflow:auto;direction:ltr;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>הבוט הקולי - מענק עבודה</h1>
    <p>דוגמאות: “מה זמן הטיפול למענק?”, “מי זכאי למענק?”, “איך מגישים בקשה?”.</p>
  </div>

  <button id="micBtn" type="button" title="דבר/י">🎤 דבר/י</button>
  <div id="debug" hidden></div>

  <df-messenger
    project-id="sandbox-kosta-test"
    agent-id="bc0af719-bdac-48d8-ba78-3befdd3c5a00"
    location="europe-west1"
    language-code="he-il"
    max-query-length="-1">
    <df-messenger-chat-bubble chat-title="בוט מענק עבודה"></df-messenger-chat-bubble>
  </df-messenger>

<script>
(() => {
  const df  = document.querySelector('df-messenger');
  const mic = document.getElementById('micBtn');
  const dbg = document.getElementById('debug');

  const SR  = window.SpeechRecognition || window.webkitSpeechRecognition;
  const log = (...a)=>{ dbg.hidden=false; dbg.textContent += a.join(' ')+'\n'; console.log(...a); };

  // סשן חדש בכל טעינה – מונע “זיכרון” שיחה ישן
  df.setAttribute('session-id', 'web-' + Date.now());

  // ===== עזרי Shadow DOM – מנסים בנימוס, לא חוסמים =====
  const sleep = (ms)=>new Promise(r=>setTimeout(r,ms));
  const defined = name => customElements.get(name) || customElements.whenDefined(name);

  function deepQuery(root, selector){
    const q = (n)=> (n.shadowRoot||n).querySelector?.(selector);
    // נסה ב־light DOM תחילה
    if (root.querySelector?.(selector)) return root.querySelector(selector);
    // נסה שכבת shadow אחת (לרוב מספיק)
    if (root.shadowRoot && root.shadowRoot.querySelector?.(selector))
      return root.shadowRoot.querySelector(selector);
    // נסה לדרוך פנימה קצת (בלי BFS כבד)
    try{
      const kids = (root.shadowRoot||root).children || [];
      for (const k of kids){
        if (q(k)) return q(k);
        if (k.shadowRoot && k.shadowRoot.querySelector?.(selector))
          return k.shadowRoot.querySelector(selector);
      }
    }catch(_){}
    return null;
  }

  function openBubble(root){
    try{
      // לוחצים על ה-host של ה-bubble (לא נכנסים ל-shadow סגור)
      const host = df.querySelector('df-messenger-chat-bubble');
      if (host){ host.click(); return true; }
      // fallback: נסיון להפעיל כל כפתור “Open”
      const any = deepQuery(root, 'button[aria-label*="Open"],button[aria-label*="פתח"],button[aria-label*="open"]');
      if (any){ any.click(); return true; }
    }catch(_){}
    return false;
  }

  function findInput(root){
    return deepQuery(root, 'textarea')
        || deepQuery(root, 'div[contenteditable="true"]')
        || deepQuery(root, '[role="textbox"]')
        || deepQuery(root, 'input[type="text"]')
        || deepQuery(root, 'input:not([type])');
  }
  function findSend(root){
    return deepQuery(root, 'button[aria-label*="Send"],button[aria-label*="שלח"],button[type="submit"]');
  }

  // ננסה להכין את ה-Messenger, אבל לא עוצרים אם לא מוכן
  async function primeMessenger(maxMs=12000){
    await defined('df-messenger');
    const deadline = Date.now() + maxMs;
    while(Date.now() < deadline){
      const root = df.shadowRoot;
      if (root){
        openBubble(root);
        const input = findInput(root);
        if (input) return { root, input };
      }
      await sleep(150);
    }
    return null; // נמשיך לשלוח תוך כדי ניסיונות
  }
  // נריץ הכנה ברקע כבר עכשיו
  primeMessenger();

  // מנגנון “שלח כשמתאפשר”: מנסה שוב עד 30ש׳ (לא חוסם)
  async function enqueueSend(text){
    const start = Date.now();
    const ttl   = 30000;       // עד 30 שניות
    const gap   = 250;         // כל 250ms נסיון
    while (Date.now() - start < ttl){
      try{
        if (await trySendOnce(text)) return true;
      }catch(_){}
      await sleep(gap);
    }
    throw new Error('Messenger not ready (queue timeout)');
  }

  async function trySendOnce(text){
    await defined('df-messenger');
    const root = df.shadowRoot;
    if (!root){ openBubble(df); return false; }

    openBubble(root);
    const input = findInput(root);
    if (!input) return false;

    // כתיבה
    if (input.tagName === 'TEXTAREA'){
      input.value = text; input.dispatchEvent(new Event('input',{bubbles:true}));
    } else if (input.isContentEditable || input.getAttribute?.('contenteditable')==='true' || input.getAttribute?.('role')==='textbox'){
      input.focus(); input.textContent='';
      document.execCommand('insertText', false, text);
      input.dispatchEvent(new InputEvent('input',{bubbles:true,data:text,inputType:'insertText'}));
    } else {
      input.value = text; input.dispatchEvent(new Event('input',{bubbles:true}));
    }
    const send = findSend(root);
    if (send) send.click();
    else {
      input.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',code:'Enter',bubbles:true}));
      input.dispatchEvent(new KeyboardEvent('keyup'  ,{key:'Enter',code:'Enter',bubbles:true}));
    }
    return true;
  }

  // מקריא תגובה
  df.addEventListener('df-response-received', (e)=>{
    try{
      const msgs = e.detail?.response?.queryResult?.responseMessages || [];
      const txt  = msgs.flatMap(m=>m.text?.text||[]).join(' ').trim();
      if (!txt || !('speechSynthesis' in window)) return;
      const u = new SpeechSynthesisUtterance(txt); u.lang='he-IL';
      const v = speechSynthesis.getVoices().find(x => (x.lang||'').toLowerCase().startsWith('he'));
      if (v) u.voice = v; speechSynthesis.speak(u);
    }catch(_){}
  });

  // ===== מיקרופון – מתחילים מייד, והשליחה מתבצעת דרך התור =====
  if (!SR){
    mic.disabled = true;
    mic.textContent = '🎤 לא נתמך בדפדפן זה';
    mic.title = 'Web Speech API לא זמין. מומלץ Chrome/Edge.';
    return;
  }

  let busy = false;

  mic.addEventListener('click', async ()=>{
    if (busy) return;
    busy = true; const label = mic.textContent;
    mic.setAttribute('aria-busy','true'); mic.textContent='🎙️ מקשיב...';

    // ודא שיש הרשאה – בלי זה recognition לפעמים לא מזניק
    try {
      await navigator.mediaDevices.getUserMedia({
        audio: { noiseSuppression:true, echoCancellation:true, autoGainControl:true }
      });
    } catch (e) {
      log('mic permission', e.name||e);
      alert('אין הרשאת מיקרופון לדף'); 
      mic.removeAttribute('aria-busy'); mic.textContent=label; busy=false;
      return;
    }

    const recOnce = (retry=false)=>new Promise(resolve=>{
      const r = new SR();
      r.lang='he-IL'; r.interimResults=true; r.continuous=false;

      let finalText='';
      r.onresult = ev=>{
        let interim='';
        for (let i=ev.resultIndex;i<ev.results.length;i++){
          const t = ev.results[i][0].transcript || '';
          if (ev.results[i].isFinal) finalText += t; else interim += t;
        }
        if (interim) mic.textContent = '🎙️ ' + interim;
      };
      r.onerror = ev=>{
        log('speech error', ev.error||ev);
        if (ev.error==='no-speech' && !retry) resolve({retry:true});
        else resolve({finalText:''});
      };
      r.onend = ()=> resolve({finalText});
      try { r.start(); } catch(e){ resolve({finalText:''}); }
    });

    // נסיון + ריטריי רך במקרה no-speech
    let res = await recOnce(false);
    if (res.retry){ mic.textContent='🗣️ נסו שוב...'; await sleep(250); res = await recOnce(true); }

    mic.removeAttribute('aria-busy'); mic.textContent=label; busy=false;

    const text = (res.finalText||'').trim();
    if (!text){ mic.title='לא זוהה דיבור (no-speech). ודא/י המיקרופון הנכון ודבר/י מיד אחרי הלחיצה.'; return; }

    // שולחים דרך תור – ימשיך לנסות עד שה-Messenger מוכן
    try {
      mic.textContent='📤 שולח...';
      await enqueueSend(text);
    } catch(e){
      log(e.message);
      alert('הצ׳אט עדיין לא מוכן. פתח/י את הבועה לפחות פעם אחת ולחצו שוב.');
    } finally {
      mic.textContent=label;
    }
  });
})();
</script>
</body>
</html>
