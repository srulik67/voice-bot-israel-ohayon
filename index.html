<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>הבוט הקולי - מענק עבודה</title>

  <!-- Dialogflow Messenger widget -->
  <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">
  <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>

  <style>
    body{
      margin:0;
      font-family:system-ui,"Segoe UI",Arial,sans-serif;
      /* רקע עם שכבת בהירות קלה */
      background:
        linear-gradient(rgba(255,255,255,.75), rgba(255,255,255,.75)),
        url('gem.png') center / cover fixed no-repeat;
    }
    .wrap{max-width:800px;margin:0 auto;padding:24px}
    df-messenger{
      position:fixed; bottom:16px; right:16px; z-index:999; direction:rtl;
      --df-messenger-font-family:system-ui,"Segoe UI",Arial,sans-serif;
    }
    #micBtn{
      position:fixed; bottom:90px; right:16px; z-index:1000;
      padding:10px 14px; border:0; border-radius:999px;
      background:#0b57d0; color:#fff; cursor:pointer; font-size:16px;
      box-shadow:0 6px 18px rgba(0,0,0,.18);
    }
    #micBtn[aria-busy="true"]{ background:#d00 }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>הבוט הקולי - מענק עבודה</h1>
    <p>דוגמאות: “מה זמן הטיפול למענק?”, “מי זכאי למענק?”, “איך מגישים בקשה?”.</p>
  </div>

  <!-- כפתור מיקרופון -->
  <button id="micBtn" type="button" title="דבר/י">🎤 דבר/י</button>

  <!-- הווידג׳ט -->
  <df-messenger
    project-id="sandbox-kosta-test"
    agent-id="bc0af719-bdac-48d8-ba78-3befdd3c5a00"
    location="europe-west1"
    language-code="he-il"
    max-query-length="-1">
    <df-messenger-chat-bubble chat-title="בוט מענק עבודה"></df-messenger-chat-bubble>
  </df-messenger>

  <script>
  window.addEventListener('DOMContentLoaded', () => {
    const df = document.querySelector('df-messenger');
    const micBtn = document.getElementById('micBtn');
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    // מחכים שהווידג׳ט יהיה מוכן באמת (כולל textarea בתוך ה-Shadow DOM)
    async function waitForMessengerReady(timeoutMs = 12000) {
      await customElements.whenDefined('df-messenger');
      const t0 = Date.now();
      return new Promise((resolve, reject) => {
        const timer = setInterval(() => {
          try {
            const root     = df.shadowRoot;
            const chat     = root && root.querySelector('df-messenger-chat');
            const chatRoot = chat && chat.shadowRoot;
            const input    = chatRoot && chatRoot.querySelector('textarea');
            if (input) { clearInterval(timer); resolve({ root, chatRoot, input }); }
            if (Date.now() - t0 > timeoutMs) { clearInterval(timer); reject(new Error('Messenger not ready')); }
          } catch (_) { /* ננסה שוב */ }
        }, 120);
      });
    }

    // אם הבועה סגורה – לפתוח אותה
    function openChatIfClosed(root) {
      const bubbleBtn = root?.querySelector('df-messenger-chat-bubble')?.shadowRoot?.querySelector('button');
      if (bubbleBtn) bubbleBtn.click();
    }

    // שליחת טקסט לתיבת הקלט
    function sendToMessenger(ctx, text) {
      const { chatRoot, input } = ctx;
      openChatIfClosed(df.shadowRoot);
      input.value = text;
      input.dispatchEvent(new Event('input', { bubbles: true }));
      const sendBtn =
        chatRoot.querySelector('button[aria-label*="Send"]') ||
        chatRoot.querySelector('button[aria-label*="שלח"]') ||
        chatRoot.querySelector('button[type="submit"]');
      if (sendBtn) sendBtn.click();
      else input.dispatchEvent(new KeyboardEvent('keydown', { key:'Enter', code:'Enter', bubbles:true }));
    }

    // הקראת תשובות (TTS)
    function hookTTS() {
      df.addEventListener('df-response-received', (e) => {
        try {
          const msgs = e.detail?.response?.queryResult?.responseMessages || [];
          const text = msgs.flatMap(m => m.text?.text || []).join(' ').trim();
          if (!text || !('speechSynthesis' in window)) return;
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'he-IL';
          const voice = speechSynthesis.getVoices().find(v => (v.lang||'').toLowerCase().startsWith('he'));
          if (voice) u.voice = voice;
          speechSynthesis.speak(u);
        } catch {}
      });
    }

    (async () => {
      let ctx;
      try {
        ctx = await waitForMessengerReady();
      } catch (e) {
        console.error(e);
        micBtn.disabled = true;
        micBtn.textContent = '🎤 שגיאה בטעינת הווידג׳ט';
        return;
      }

      hookTTS();

      if (!SR) {
        micBtn.disabled = true;
        micBtn.textContent = '🎤 לא נתמך בדפדפן זה';
        micBtn.title = 'Web Speech API לא זמין. מומלץ Chrome/Edge.';
        return;
      }

      micBtn.addEventListener('click', () => {
        const r = new SR();
        r.lang = 'he-IL';
        r.interimResults = false;
        r.maxAlternatives = 1;

        r.onstart = () => micBtn.setAttribute('aria-busy', 'true');
        r.onend   = () => micBtn.removeAttribute('aria-busy');
        r.onerror = () => micBtn.removeAttribute('aria-busy');

        r.onresult = (ev) => {
          const text = ev.results[0][0].transcript || '';
          if (text.trim()) sendToMessenger(ctx, text.trim());
        };

        try { r.start(); } catch(_) {}
      });
    })();
  });
  </script>
</body>
</html>
